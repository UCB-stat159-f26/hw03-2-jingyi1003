[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career"
version = "0.1.0"
description = "Retrieve and plot singles career matches from Tennis Abstract"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "matplotlib>=3.7"]

[tool.setuptools]
py-modules = ["tennis_career"]
